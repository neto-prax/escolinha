

services:
  # Servidor do Gateway WA-AKG (Next.js 15 + Baileys)
  wa-akg:
    image: node:22-bookworm-slim
    container_name: wa-akg-gateway
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=mysql://akg_user:akg_pass123@wa-akg-mysql:3306/wa_akg
      - AUTH_SECRET=sua-chave-secreta-jwt-32-caracteres-minimo
      - AUTH_TRUST_HOST=true
      - WEBHOOK_URL=https://eafntyicpalnyzonnrgn.supabase.co/functions/v1/evolution-webhook
    depends_on:
      wa-akg-mysql:
        condition: service_healthy
    command: >
      sh -c "
        apt-get update && apt-get install -y --no-install-recommends openssl ca-certificates git python3 make g++ && rm -rf /var/lib/apt/lists/*;
        if [ ! -f package.json ]; then
          echo 'Clonando repositório WA-AKG...';
          git clone --depth 1 https://github.com/mrifqidaffaaditya/WA-AKG.git /tmp/wa-repo;
          cp -r /tmp/wa-repo/. /app/;
          rm -rf /tmp/wa-repo;
          npm install --include=dev;
        fi;
        npx prisma generate;
        npx prisma db push;
        npm run build;
        npm run start;
      "
    volumes:
      - wa-akg-data:/app/data
      - wa-akg-sessions:/app/sessions

  # Banco de Dados MySQL dedicado para o WA-AKG
  wa-akg-mysql:
    image: mysql:8.0
    container_name: wa-akg-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_wa_akg
      MYSQL_DATABASE: wa_akg
      MYSQL_USER: akg_user
      MYSQL_PASSWORD: akg_pass123
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass_wa_akg"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - wa-akg-mysql-data:/var/lib/mysql

volumes:
  wa-akg-data:
  wa-akg-sessions:
  wa-akg-mysql-data:

